version: "3.8"

services:
  postgres:
    image: postgres:17
    ports:
      - 127.0.0.1:5432:5432
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready --username=postgres"]
      interval: 5s
      timeout: 3s
      retries: 3

volumes:
  db-data:

networks:
  postgres-net:
    driver: bridge
